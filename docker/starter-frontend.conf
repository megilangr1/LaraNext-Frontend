server {
    listen 80;
    # Ganti dengan domain/subdomain asli untuk frontend kamu
    server_name starter.chiro-it.site www.starter.chiro-it.site;

    # Optimasi ukuran upload jika frontend kamu ada fitur upload dokumen/gambar
    client_max_body_size 20M;

    location / {
        # Teruskan trafik langsung ke port 3000 container Next.js
        proxy_pass http://127.0.0.1:3000;

        # Oper header asli user agar Next.js bisa mengenali IP & Protokol asli
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mendukung fiture WebSocket (penting jika Next.js pakai HMR/Realtime features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Log file untuk memantau trafik frontend
    access_log /var/log/nginx/starter_frontend_access.log;
    error_log /var/log/nginx/starter_frontend_error.log;
}

